# ── PREFIX ───────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── SETTINGS ─────────────────────────────
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 10000
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# ── VIM PANE NAV ─────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── SPLITS (open in current dir) ─────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window   -c "#{pane_current_path}"

# ── RELOAD CONFIG ────────────────────────
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# ── STATUS BAR (Catppuccin) ───────────────
set -g status-style        'bg=#1e1e2e fg=#cdd6f4'
set -g status-left         '#[fg=#a6e3a1,bold] #S  '
set -g status-right        '#[fg=#89b4fa] %H:%M #[fg=#cba6f7] %d %b'
set -g window-status-current-style 'fg=#fab387,bold'

# ── PLUGINS (TPM) ────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'   # save sessions
set -g @plugin 'tmux-plugins/tmux-continuum'   # auto-save + restore
set -g @continuum-restore 'on'
run '~/.tmux/plugins/tpm/tpm'
