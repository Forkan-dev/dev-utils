# ── Starship prompt config ────────────────
# Docs: https://starship.rs/config/

format = """
$username\
$directory\
$git_branch\
$git_status\
$golang\
$nodejs\
$php\
$docker_context\
$cmd_duration\
$line_break\
$character"""

[character]
success_symbol = "[❯](bold green)"
error_symbol   = "[❯](bold red)"

[directory]
truncation_length    = 3
truncate_to_repo     = true
style                = "bold blue"

[git_branch]
symbol = " "
style  = "bold mauve"

[git_status]
style     = "bold red"
ahead     = "⇡${count}"
behind    = "⇣${count}"
diverged  = "⇕⇡${ahead_count}⇣${behind_count}"
modified  = "!${count}"
untracked = "?${count}"
staged    = "+${count}"

[golang]
symbol = " "
style  = "bold cyan"

[nodejs]
symbol = " "
style  = "bold green"

[php]
symbol = " "
style  = "bold blue"

[docker_context]
symbol = " "
style  = "bold blue"

[cmd_duration]
min_time          = 2000
format            = "took [$duration](bold yellow) "
show_milliseconds = false
