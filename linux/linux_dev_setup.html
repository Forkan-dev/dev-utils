<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Linux Dev Setup</title>
<style>
  /* ── Reset & Base ─────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --base:    #11111b;
    --mantle:  #181825;
    --crust:   #1e1e2e;
    --surface0:#313244;
    --surface1:#45475a;
    --overlay0:#6c7086;
    --text:    #cdd6f4;
    --subtext1:#bac2de;
    --subtext0:#a6adc8;
    --green:   #a6e3a1;
    --blue:    #89b4fa;
    --mauve:   #cba6f7;
    --peach:   #fab387;
    --yellow:  #f9e2af;
    --red:     #f38ba8;
    --teal:    #94e2d5;
    --accent:  #1D9E75;
    --accent-dim: #0f5c44;
    --accent-glow: rgba(29,158,117,0.15);
    --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'SF Mono', monospace;
    --radius: 10px;
    --sidebar: 240px;
    --transition: 0.18s ease;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--base);
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 14px;
    line-height: 1.6;
    min-height: 100vh;
  }

  .page-layout { display: flex; min-height: 100vh; }

  /* ── Sidebar ──────────────────────────────────────────── */
  .sidebar {
    width: var(--sidebar);
    background: var(--mantle);
    border-right: 1px solid var(--surface0);
    position: fixed;
    top: 0; left: 0;
    height: 100vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    z-index: 100;
    transition: transform var(--transition);
  }

  .sidebar::-webkit-scrollbar { width: 4px; }
  .sidebar::-webkit-scrollbar-track { background: transparent; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--surface0); border-radius: 2px; }

  .sidebar-brand { padding: 20px 16px 16px; border-bottom: 1px solid var(--surface0); }

  .brand-icon {
    width: 32px; height: 32px;
    background: var(--accent);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    margin-bottom: 10px;
  }

  .brand-title { font-size: 12px; font-weight: 700; color: var(--text); letter-spacing: 0.05em; text-transform: uppercase; }
  .brand-sub { font-size: 11px; color: var(--overlay0); margin-top: 2px; }

  .progress-wrap {
    padding: 14px 16px;
    border-bottom: 1px solid var(--surface0);
    display: flex; align-items: center; gap: 10px;
  }

  .progress-ring-wrap { flex-shrink: 0; position: relative; width: 36px; height: 36px; }
  .progress-ring-wrap svg { transform: rotate(-90deg); }
  .progress-ring-bg { fill: none; stroke: var(--surface0); stroke-width: 3; }
  .progress-ring-bar { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linecap: round; transition: stroke-dashoffset 0.4s ease; }

  .progress-pct {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; font-weight: 700; color: var(--accent);
  }

  .progress-info { flex: 1; min-width: 0; }
  .progress-label { font-size: 11px; color: var(--subtext0); }
  .progress-count { font-size: 12px; font-weight: 600; color: var(--text); }

  .sidebar-nav { flex: 1; padding: 8px 0; }

  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 14px; cursor: pointer;
    border-left: 2px solid transparent;
    transition: all var(--transition);
    text-decoration: none; color: inherit;
  }

  .nav-item:hover { background: var(--surface0); border-left-color: var(--surface1); }
  .nav-item.active { background: var(--accent-glow); border-left-color: var(--accent); }

  .nav-num {
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--surface0); font-size: 10px; font-weight: 700; color: var(--subtext0);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: all var(--transition);
  }

  .nav-item.active .nav-num { background: var(--accent); color: #fff; }
  .nav-item.done .nav-num { background: var(--accent-dim); color: var(--green); }
  .nav-item.done .nav-num::after { content: '✓'; font-size: 9px; }
  .nav-item.done .nav-num span { display: none; }

  .nav-text { flex: 1; min-width: 0; }
  .nav-title { font-size: 12px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nav-item.active .nav-title { color: var(--accent); }
  .nav-steps { font-size: 10px; color: var(--overlay0); margin-top: 1px; }

  .sidebar-footer { padding: 12px 16px; border-top: 1px solid var(--surface0); font-size: 10px; color: var(--overlay0); text-align: center; }

  /* ── Main ─────────────────────────────────────────────── */
  .main { margin-left: var(--sidebar); flex: 1; min-width: 0; }

  .page-header {
    background: var(--mantle);
    border-bottom: 1px solid var(--surface0);
    padding: 24px 32px 20px;
    position: sticky; top: 0; z-index: 50;
  }

  .page-header-inner {
    max-width: 780px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }

  .page-title { font-size: 18px; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 8px; }

  .page-title .chip {
    font-size: 10px; font-weight: 600;
    background: var(--accent-glow); color: var(--accent);
    border: 1px solid var(--accent-dim);
    padding: 2px 8px; border-radius: 20px; letter-spacing: 0.05em;
  }

  .page-subtitle { font-size: 12px; color: var(--subtext0); margin-top: 3px; }

  .header-actions { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }

  .btn {
    font-size: 12px; font-weight: 500; padding: 6px 14px;
    border-radius: 7px; border: 1px solid var(--surface1);
    background: var(--surface0); color: var(--subtext1);
    cursor: pointer; transition: all var(--transition); font-family: var(--font-sans);
  }

  .btn:hover { background: var(--surface1); color: var(--text); }

  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-primary:hover { background: #18b085; border-color: #18b085; color: #fff; }

  .content { padding: 28px 32px 60px; max-width: 780px; margin: 0 auto; }

  /* ── Phase ────────────────────────────────────────────── */
  .phase { display: none; }
  .phase.show { display: block; animation: fadeIn 0.2s ease; }

  .phase-hero {
    background: var(--mantle); border: 1px solid var(--surface0);
    border-radius: 14px; padding: 20px 22px; margin-bottom: 20px;
    display: flex; gap: 16px; align-items: flex-start;
  }

  .phase-icon {
    width: 44px; height: 44px; border-radius: 12px;
    background: var(--accent-glow); border: 1px solid var(--accent-dim);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; flex-shrink: 0;
  }

  .phase-hero-body { flex: 1; }

  .phase-hero-top { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }

  .phase-num-badge {
    font-size: 10px; font-weight: 700;
    background: var(--accent); color: #fff;
    padding: 2px 7px; border-radius: 20px;
  }

  .phase-title { font-size: 17px; font-weight: 700; color: var(--text); }
  .phase-desc { font-size: 13px; color: var(--subtext0); line-height: 1.5; }

  .phase-meta { display: flex; gap: 16px; margin-top: 12px; flex-wrap: wrap; }

  .phase-meta-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--overlay0); }
  .phase-meta-item strong { color: var(--subtext1); font-weight: 600; }

  .prereq {
    background: rgba(250,179,135,0.07); border: 1px solid rgba(250,179,135,0.2);
    border-radius: var(--radius); padding: 12px 14px; margin-bottom: 18px;
    display: flex; gap: 10px; align-items: flex-start;
  }

  .prereq-icon { font-size: 14px; flex-shrink: 0; margin-top: 1px; }
  .prereq-title { font-size: 11px; font-weight: 700; color: var(--peach); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 4px; }
  .prereq-text { font-size: 12px; color: var(--subtext0); line-height: 1.5; }
  .prereq-text code { font-family: var(--font-mono); background: var(--surface0); padding: 1px 5px; border-radius: 4px; font-size: 11px; color: var(--peach); }

  .steps-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .steps-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--overlay0); }
  .steps-progress { font-size: 11px; color: var(--overlay0); }
  .steps-progress strong { color: var(--accent); }

  /* Step card */
  .step { margin-bottom: 8px; border: 1px solid var(--surface0); border-radius: var(--radius); overflow: hidden; transition: border-color var(--transition); }
  .step:hover { border-color: var(--surface1); }
  .step.open { border-color: var(--surface1); }
  .step.completed { border-color: var(--accent-dim); }
  .step.completed .step-head { background: rgba(29,158,117,0.04); }

  .step-head {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px; cursor: pointer;
    background: var(--mantle); transition: background var(--transition); user-select: none;
  }

  .step-head:hover { background: var(--crust); }

  .step-check {
    width: 20px; height: 20px; border-radius: 50%;
    border: 1.5px solid var(--surface1); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all var(--transition); background: transparent;
  }

  .step-check:hover { border-color: var(--accent); background: var(--accent-glow); }
  .step.completed .step-check { background: var(--accent); border-color: var(--accent); color: #fff; }
  .step-check-icon { font-size: 10px; color: transparent; }
  .step.completed .step-check-icon { color: #fff; }

  .step-label { font-size: 13px; font-weight: 500; color: var(--text); flex: 1; line-height: 1.4; }
  .step.completed .step-label { color: var(--subtext0); text-decoration: line-through; text-decoration-color: var(--surface1); }

  .step-tag {
    font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 5px;
    background: var(--surface0); color: var(--subtext0);
    flex-shrink: 0; text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap;
  }

  .step-tag.required    { background: rgba(243,139,168,0.1); color: var(--red); }
  .step-tag.setup       { background: rgba(137,180,250,0.1); color: var(--blue); }
  .step-tag.config      { background: rgba(203,166,247,0.1); color: var(--mauve); }
  .step-tag.plugins     { background: rgba(166,227,161,0.1); color: var(--green); }
  .step-tag.ssh         { background: rgba(249,226,175,0.1); color: var(--yellow); }
  .step-tag.clean       { background: rgba(148,226,213,0.1); color: var(--teal); }
  .step-tag.template    { background: rgba(250,179,135,0.1); color: var(--peach); }
  .step-tag.golang      { background: rgba(137,180,250,0.1); color: var(--blue); }
  .step-tag.automate    { background: rgba(166,227,161,0.1); color: var(--green); }
  .step-tag.onecommand  { background: rgba(148,226,213,0.1); color: var(--teal); }
  .step-tag.mainconfig  { background: rgba(203,166,247,0.1); color: var(--mauve); }
  .step-tag.reference   { background: rgba(249,226,175,0.1); color: var(--yellow); }
  .step-tag.php83       { background: rgba(250,179,135,0.1); color: var(--peach); }
  .step-tag.distro      { background: rgba(137,180,250,0.1); color: var(--blue); }
  .step-tag.apt         { background: rgba(148,226,213,0.1); color: var(--teal); }
  .step-tag.flatpak     { background: rgba(203,166,247,0.1); color: var(--mauve); }
  .step-tag.git         { background: rgba(250,179,135,0.1); color: var(--peach); }
  .step-tag.wm          { background: rgba(203,166,247,0.1); color: var(--mauve); }
  .step-tag.systemd     { background: rgba(249,226,175,0.1); color: var(--yellow); }

  .step-chevron {
    width: 20px; height: 20px;
    display: flex; align-items: center; justify-content: center;
    color: var(--overlay0); font-size: 11px;
    transition: transform 0.2s ease; flex-shrink: 0;
  }

  .step.open .step-chevron { transform: rotate(90deg); }

  .step-body { display: none; border-top: 1px solid var(--surface0); padding: 16px; background: var(--base); }

  .step-note {
    font-size: 12.5px; color: var(--subtext0); line-height: 1.65;
    margin-bottom: 14px; padding: 10px 12px;
    background: var(--mantle); border-left: 3px solid var(--surface1); border-radius: 0 6px 6px 0;
  }

  .file-block { margin-bottom: 14px; }
  .file-block:last-child { margin-bottom: 0; }

  .file-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }

  .file-name {
    font-size: 11px; font-family: var(--font-mono); color: var(--mauve);
    background: rgba(203,166,247,0.08); padding: 2px 8px;
    border-radius: 4px; border: 1px solid rgba(203,166,247,0.15);
  }

  .copy-btn {
    font-size: 10px; font-weight: 600; padding: 3px 10px;
    border: 1px solid var(--surface1); border-radius: 5px;
    background: var(--surface0); color: var(--subtext0);
    cursor: pointer; transition: all var(--transition); font-family: var(--font-sans);
    letter-spacing: 0.03em; text-transform: uppercase;
  }

  .copy-btn:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
  .copy-btn.copied { background: var(--accent-dim); border-color: var(--accent); color: var(--green); }

  pre {
    background: var(--crust); border: 1px solid var(--surface0); border-radius: 8px;
    padding: 14px 16px; font-size: 12px; line-height: 1.75; overflow-x: auto;
    font-family: var(--font-mono); white-space: pre; color: var(--text);
  }

  pre::-webkit-scrollbar { height: 4px; }
  pre::-webkit-scrollbar-track { background: transparent; }
  pre::-webkit-scrollbar-thumb { background: var(--surface1); border-radius: 2px; }

  .c { color: var(--overlay0); font-style: italic; }
  .g { color: var(--overlay0); font-style: italic; }
  .s { color: var(--green); }
  .k { color: var(--blue); }
  .v { color: var(--peach); }
  .h { color: var(--mauve); }

  .phase-nav {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--surface0);
  }

  .phase-nav .btn { display: flex; align-items: center; gap: 6px; }
  .phase-nav .btn-ghost { background: transparent; border-color: var(--surface0); color: var(--subtext0); }
  .phase-nav .btn-ghost:hover { background: var(--surface0); color: var(--text); }

  .phase-nav-center { font-size: 11px; color: var(--overlay0); display: flex; gap: 4px; align-items: center; }

  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--surface0); cursor: pointer; transition: background var(--transition); }
  .dot.active { background: var(--accent); }

  .hamburger {
    display: none; position: fixed; top: 14px; left: 14px; z-index: 200;
    width: 36px; height: 36px; border-radius: 8px;
    background: var(--mantle); border: 1px solid var(--surface0);
    cursor: pointer; align-items: center; justify-content: center;
    font-size: 16px; color: var(--text);
  }

  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 99; }

  @media (max-width: 768px) {
    .sidebar { transform: translateX(-100%); }
    .sidebar.open { transform: translateX(0); box-shadow: 4px 0 24px rgba(0,0,0,0.4); }
    .hamburger { display: flex; }
    .overlay.show { display: block; }
    .main { margin-left: 0; }
    .page-header { padding: 14px 16px 14px 60px; }
    .content { padding: 20px 16px 40px; }
    .phase-hero { flex-direction: column; gap: 12px; }
    .header-actions { display: none; }
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--mantle); }
  ::-webkit-scrollbar-thumb { background: var(--surface0); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--surface1); }
</style>
</head>
<body>

<button class="hamburger" id="hamburger" onclick="toggleSidebar()" title="Menu">☰</button>
<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

<div class="page-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-icon">🐧</div>
      <div class="brand-title">Dev Setup</div>
      <div class="brand-sub">Linux · Ubuntu / Debian / Arch</div>
    </div>

    <div class="progress-wrap">
      <div class="progress-ring-wrap">
        <svg width="36" height="36" viewBox="0 0 36 36">
          <circle class="progress-ring-bg" cx="18" cy="18" r="14"/>
          <circle class="progress-ring-bar" id="progressBar" cx="18" cy="18" r="14"
            stroke-dasharray="87.96" stroke-dashoffset="87.96"/>
        </svg>
        <div class="progress-pct" id="progressPct">0%</div>
      </div>
      <div class="progress-info">
        <div class="progress-label">Overall Progress</div>
        <div class="progress-count" id="progressCount">0 of 0 steps done</div>
      </div>
    </div>

    <nav class="sidebar-nav" id="sidebarNav"></nav>

    <div class="sidebar-footer">8 phases · ~40 min total</div>
  </aside>

  <div class="main">
    <header class="page-header">
      <div class="page-header-inner">
        <div>
          <div class="page-title">
            Linux Dev Setup
            <span class="chip">Ubuntu / Arch</span>
          </div>
          <div class="page-subtitle">Complete developer environment from scratch — packages to dotfiles</div>
        </div>
        <div class="header-actions">
          <button class="btn" onclick="expandAll()">Expand All</button>
          <button class="btn btn-primary" onclick="resetProgress()">Reset Progress</button>
        </div>
      </div>
    </header>

    <main class="content" id="content"></main>
  </div>
</div>

<script>
var data = [
  {
    icon: "📦",
    title: "System Update & Core Packages",
    sub: "Refresh package index, upgrade system, install essential build tools",
    time: "~5 min",
    prereq: null,
    steps: [
      {
        label: "Update & upgrade system packages",
        tag: "required",
        note: "Always update before installing anything. On Arch, use pacman instead — commands shown for both Ubuntu/Debian and Arch.",
        files: [
          { name: "terminal — Ubuntu / Debian",
            code: '<span class="c"># Update package index and upgrade all installed packages</span>\nsudo apt update && sudo apt upgrade -y\n\n<span class="c"># Install essential build tools</span>\nsudo apt install -y build-essential curl wget git unzip zip \\\n  ca-certificates gnupg lsb-release software-properties-common'
          },
          { name: "terminal — Arch / Manjaro",
            code: '<span class="c"># Full system upgrade</span>\nsudo pacman -Syu\n\n<span class="c"># Install base development tools</span>\nsudo pacman -S --needed base-devel curl wget git unzip zip'
          }
        ]
      },
      {
        label: "Install Zsh and set as default shell",
        tag: "required",
        note: "Zsh is not the default on most Linux distros. Install it and change your login shell. You will need to log out and back in for the change to take effect.",
        files: [
          { name: "terminal — Ubuntu / Debian",
            code: 'sudo apt install -y zsh\n\n<span class="c"># Set zsh as default shell for current user</span>\nchsh -s $(which zsh)\n\n<span class="c"># Verify (after re-login)</span>\necho $SHELL'
          },
          { name: "terminal — Arch",
            code: 'sudo pacman -S zsh\nchsh -s $(which zsh)'
          }
        ]
      },
      {
        label: "Install Nerd Font for terminal icons",
        tag: "fonts",
        note: "JetBrains Mono Nerd Font is required for eza --icons, starship glyphs, and Neovim icons to render correctly.",
        files: [
          { name: "terminal",
            code: '<span class="c"># Download JetBrains Mono Nerd Font</span>\nmkdir -p ~/.local/share/fonts\ncd /tmp\ncurl -fLo "JetBrainsMono.zip" \\\n  https://github.com/ryanoasis/nerd-fonts/releases/latest/download/JetBrainsMono.zip\nunzip -o JetBrainsMono.zip -d ~/.local/share/fonts/JetBrainsMono/\n\n<span class="c"># Rebuild font cache</span>\nfc-cache -fv\n\n<span class="c"># Verify font is found</span>\nfc-list | grep "JetBrains"'
          }
        ]
      }
    ]
  },
  {
    icon: "🛠",
    title: "CLI Tools",
    sub: "ripgrep, fd, fzf, bat, eza, zoxide, starship — the modern Unix toolkit",
    time: "~5 min",
    prereq: "Zsh installed (Phase 1)",
    steps: [
      {
        label: "Install modern CLI replacements",
        tag: "apt",
        note: "These tools replace standard Unix utilities with faster, smarter alternatives. bat replaces cat, eza replaces ls, ripgrep replaces grep, zoxide replaces cd.",
        files: [
          { name: "terminal — Ubuntu 22.04+",
            code: 'sudo apt install -y \\\n  ripgrep \\\n  fd-find \\\n  fzf \\\n  bat \\\n  tmux \\\n  neovim \\\n  stow\n\n<span class="c"># Ubuntu names the binary \'fdfind\' and \'batcat\' — add aliases</span>\nmkdir -p ~/.local/bin\nln -sf $(which fdfind) ~/.local/bin/fd\nln -sf $(which batcat) ~/.local/bin/bat'
          },
          { name: "terminal — Arch",
            code: 'sudo pacman -S ripgrep fd fzf bat tmux neovim stow'
          }
        ]
      },
      {
        label: "Install eza (better ls)",
        tag: "apt",
        note: "eza is not in the default apt repos on Ubuntu. Install via the official apt repository.",
        files: [
          { name: "terminal — Ubuntu / Debian",

            code: '#!/usr/bin/env bash\nset -euo pipefail\n\necho "Setting up Linux dev environment..."\n\n<span class="c"># ── Detect distro ─────────────────────────</span>\nif command -v apt &>/dev/null; then\n  PKG="apt"\nelif command -v pacman &>/dev/null; then\n  PKG="pacman"\nelse\n  echo "Unsupported distro"; exit 1\nfi\n\n<span class="c"># ── 1. Base packages ──────────────────────</span>\nif [ "$PKG" = "apt" ]; then\n  sudo apt update && sudo apt install -y \\\n    build-essential curl wget git unzip zsh stow \\\n    ripgrep fd-find fzf bat tmux neovim\n  ln -sf $(which fdfind) ~/.local/bin/fd 2>/dev/null\n  ln -sf $(which batcat) ~/.local/bin/bat 2>/dev/null\nelse\n  sudo pacman -Syu --needed base-devel curl wget git zsh stow \\\n    ripgrep fd fzf bat tmux neovim\nfi\n\n<span class="c"># ── 2. zoxide + starship ──────────────────</span>\ncurl -sSfL https://raw.githubusercontent.com/ajeetdsouza/zoxide/main/install.sh | sh\ncurl -sS https://starship.rs/install.sh | sh\n\n<span class="c"># ── 3. Symlink dotfiles ───────────────────</span>\ncd ~/dotfiles && stow */\n\n<span class="c"># ── 4. Set default shell ──────────────────</span>\nchsh -s $(which zsh)\n\necho ""\necho "Done! Log out and back in for zsh to take effect."\necho "Then run: gh auth login"'
          }
        ]
      }
    ]
  }
];

// ── State ──────────────────────────────────────────────────────
var currentPhase = 0;
var totalSteps = 0;
var completedSet = new Set();

try {
  var saved = JSON.parse(localStorage.getItem('linux_devsetup_done') || '[]');
  saved.forEach(function(k){ completedSet.add(k); });
} catch(e) {}

function saveProgress() {
  localStorage.setItem('linux_devsetup_done', JSON.stringify(Array.from(completedSet)));
}

function stepKey(pi, si) { return pi + '_' + si; }

function buildUI() {
  data.forEach(function(p){ totalSteps += p.steps.length; });
  buildSidebar();
  buildContent();
  updateProgress();
  showPhase(0, false);
}

function buildSidebar() {
  var nav = document.getElementById('sidebarNav');
  var html = '';
  data.forEach(function(phase, pi) {
    var done = countDone(pi);
    var isDone = done === phase.steps.length && phase.steps.length > 0;
    html += '<div class="nav-item' + (isDone ? ' done' : '') + '" id="navItem' + pi + '" onclick="showPhase(' + pi + ')">';
    html += '<div class="nav-num"><span>' + (pi+1) + '</span></div>';
    html += '<div class="nav-text">';
    html += '<div class="nav-title">' + phase.title + '</div>';
    html += '<div class="nav-steps">' + phase.steps.length + ' steps · ' + phase.time + '</div>';
    html += '</div></div>';
  });
  nav.innerHTML = html;
}

function buildContent() {
  var content = document.getElementById('content');
  var html = '';

  data.forEach(function(phase, pi) {
    html += '<div class="phase" id="ph' + pi + '">';

    html += '<div class="phase-hero">';
    html += '<div class="phase-icon">' + phase.icon + '</div>';
    html += '<div class="phase-hero-body">';
    html += '<div class="phase-hero-top"><span class="phase-num-badge">Phase ' + (pi+1) + ' of ' + data.length + '</span></div>';
    html += '<div class="phase-title">' + phase.title + '</div>';
    html += '<div class="phase-desc">' + phase.sub + '</div>';
    html += '<div class="phase-meta">';
    html += '<div class="phase-meta-item">⏱ <strong>' + phase.time + '</strong></div>';
    html += '<div class="phase-meta-item">📋 <strong>' + phase.steps.length + ' steps</strong></div>';
    if (phase.prereq) {
      html += '<div class="phase-meta-item">🔗 <strong>Requires:</strong> ' + phase.prereq + '</div>';
    }
    html += '</div></div></div>';

    if (phase.prereq) {
      html += '<div class="prereq">';
      html += '<div class="prereq-icon">⚠️</div>';
      html += '<div><div class="prereq-title">Before you start</div>';
      html += '<div class="prereq-text">Make sure you have completed: <code>' + phase.prereq + '</code></div></div>';
      html += '</div>';
    }

    html += '<div class="steps-header">';
    html += '<div class="steps-label">Steps</div>';
    html += '<div class="steps-progress" id="stepProgress' + pi + '"></div>';
    html += '</div>';

    phase.steps.forEach(function(step, si) {
      var key = stepKey(pi, si);
      var isDone = completedSet.has(key);
      var tagClass = (step.tag || '').replace(/[^a-z0-9]/g,'').toLowerCase();

      html += '<div class="step' + (isDone ? ' completed' : '') + '" id="step' + pi + si + '">';
      html += '<div class="step-head" onclick="toggleStep(event,' + pi + ',' + si + ')">';
      html += '<div class="step-check" onclick="event.stopPropagation();toggleDone(' + pi + ',' + si + ')" title="Mark as done">';
      html += '<span class="step-check-icon">✓</span>';
      html += '</div>';
      html += '<span class="step-label">' + step.label + '</span>';
      if (step.tag) html += '<span class="step-tag ' + tagClass + '">' + step.tag + '</span>';
      html += '<span class="step-chevron">▶</span>';
      html += '</div>';

      html += '<div class="step-body" style="display:none">';
      html += '<div class="step-note">' + step.note + '</div>';

      step.files.forEach(function(f) {
        var plain = f.code.replace(/<[^>]+>/g,'');
        var escaped = plain.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,'\\n');
        html += '<div class="file-block">';
        html += '<div class="file-bar">';
        html += '<span class="file-name">' + f.name + '</span>';
        html += '<button class="copy-btn" onclick="copyCode(this,\'' + escaped + '\')">copy</button>';
        html += '</div>';
        html += '<pre>' + f.code + '</pre>';
        html += '</div>';
      });

      html += '</div></div>';
    });

    html += '<div class="phase-nav">';
    if (pi > 0) {
      html += '<button class="btn btn-ghost" onclick="showPhase(' + (pi-1) + ')">← ' + data[pi-1].title.split(' ')[0] + '</button>';
    } else {
      html += '<span></span>';
    }
    html += '<div class="phase-nav-center">';
    data.forEach(function(_,di){
      html += '<div class="dot' + (di===pi ? ' active' : '') + '" onclick="showPhase(' + di + ')"></div>';
    });
    html += '</div>';
    if (pi < data.length - 1) {
      html += '<button class="btn btn-primary" onclick="showPhase(' + (pi+1) + ')">Next: ' + data[pi+1].title.split(' ')[0] + ' →</button>';
    } else {
      html += '<button class="btn btn-primary" onclick="alert(\'Setup complete! Your Linux machine is fully configured.\')">Done!</button>';
    }
    html += '</div>';

    html += '</div>';
  });

  content.innerHTML = html;
  data.forEach(function(_,pi){ updateStepProgress(pi); });
}

function showPhase(i, animate) {
  currentPhase = i;
  document.querySelectorAll('.phase').forEach(function(el){ el.classList.remove('show'); });
  var phEl = document.getElementById('ph' + i);
  if (phEl) phEl.classList.add('show');

  document.querySelectorAll('.nav-item').forEach(function(el,idx){
    el.classList.remove('active');
    var done = countDone(idx) === data[idx].steps.length && data[idx].steps.length > 0;
    el.classList.toggle('done', done);
  });
  var ni = document.getElementById('navItem' + i);
  if (ni) ni.classList.add('active');

  if (window.innerWidth <= 768) {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('overlay').classList.remove('show');
  }
  window.scrollTo(0, 0);
}

function toggleStep(event, pi, si) {
  var stepEl = document.getElementById('step' + pi + si);
  var body = stepEl.querySelector('.step-body');
  var chevron = stepEl.querySelector('.step-chevron');
  var isOpen = stepEl.classList.toggle('open');
  body.style.display = isOpen ? 'block' : 'none';
  chevron.style.transform = isOpen ? 'rotate(90deg)' : '';
}

function toggleDone(pi, si) {
  var key = stepKey(pi, si);
  var stepEl = document.getElementById('step' + pi + si);
  if (completedSet.has(key)) {
    completedSet.delete(key);
    stepEl.classList.remove('completed');
  } else {
    completedSet.add(key);
    stepEl.classList.add('completed');
  }
  saveProgress();
  updateProgress();
  updateStepProgress(pi);
  var done = countDone(pi) === data[pi].steps.length;
  var ni = document.getElementById('navItem' + pi);
  if (ni) ni.classList.toggle('done', done);
}

function countDone(pi) {
  var count = 0;
  for (var si = 0; si < data[pi].steps.length; si++) {
    if (completedSet.has(stepKey(pi, si))) count++;
  }
  return count;
}

function updateStepProgress(pi) {
  var done = countDone(pi);
  var total = data[pi].steps.length;
  var el = document.getElementById('stepProgress' + pi);
  if (el) el.innerHTML = '<strong>' + done + '</strong> / ' + total + ' done';
}

function updateProgress() {
  var done = completedSet.size;
  var pct = totalSteps > 0 ? Math.round((done / totalSteps) * 100) : 0;
  var circumference = 87.96;
  var offset = circumference - (circumference * pct / 100);
  document.getElementById('progressPct').textContent = pct + '%';
  document.getElementById('progressCount').textContent = done + ' of ' + totalSteps + ' steps done';
  document.getElementById('progressBar').style.strokeDashoffset = offset;
}

function expandAll() {
  var phase = document.getElementById('ph' + currentPhase);
  if (!phase) return;
  phase.querySelectorAll('.step').forEach(function(stepEl) {
    stepEl.classList.add('open');
    stepEl.querySelector('.step-body').style.display = 'block';
    stepEl.querySelector('.step-chevron').style.transform = 'rotate(90deg)';
  });
}

function resetProgress() {
  if (!confirm('Reset all progress?')) return;
  completedSet.clear();
  localStorage.removeItem('linux_devsetup_done');
  document.querySelectorAll('.step.completed').forEach(function(el){ el.classList.remove('completed'); });
  document.querySelectorAll('.nav-item.done').forEach(function(el){ el.classList.remove('done'); });
  updateProgress();
  data.forEach(function(_,pi){ updateStepProgress(pi); });
}

function copyCode(btn, text) {
  var decoded = text.replace(/\\n/g,'\n').replace(/\\\\/g,'\\').replace(/\\'/g,"'");
  navigator.clipboard.writeText(decoded).then(function(){
    btn.textContent = 'copied!';
    btn.classList.add('copied');
    setTimeout(function(){ btn.textContent = 'copy'; btn.classList.remove('copied'); }, 1800);
  });
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');
}

buildUI();
</script>
</body>
</html>
